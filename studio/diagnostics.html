<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AniCanto · Live diagnostics</title>
<style>body{font:16px system-ui;background:#14121c;color:#ede7ff;margin:2rem}input,button{font:inherit;padding:.6rem;background:#292334;color:inherit;border:1px solid #84719f;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace}section{border-top:1px solid #574666;padding:1rem 0}header{position:sticky;top:0;background:#14121c;padding:1rem 0}summary{cursor:pointer}#status{color:#c8b6e4}</style>
<header><h1>AniCanto · Live diagnostics</h1><p>Read-only · Settings, frozen requests and bounded logs · Refresh every 3 seconds</p><form id="login"><input id="code" type="password" autocomplete="off" placeholder="Access code from the desktop app" aria-label="Access code" size="40"><button>Connect</button><button type="button" id="logout">Disconnect</button></form><p id="status" role="status">Enter the access code shown in Welcome → Help centre → LAN diagnostics.</p></header><main id="data"></main>
<script>
let key='',busy=false;const status=document.querySelector('#status'),data=document.querySelector('#data');
document.querySelector('#login').onsubmit=e=>{e.preventDefault();key=document.querySelector('#code').value.trim();document.querySelector('#code').value='';refresh()};document.querySelector('#logout').onclick=()=>{key='';data.replaceChildren();status.textContent='Disconnected';};
async function refresh(){if(!key||busy)return;busy=true;const active=key;try{const r=await fetch('/api/snapshot',{headers:{Authorization:'Bearer '+active},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Access code rejected. Reconnect with the current code.':'HTTP '+r.status);const v=await r.json();if(key!==active)return;status.textContent=v.system+' · '+v.version+' · Host '+v.hostPID+' · Updated '+new Date(v.observedAt*1000).toLocaleTimeString();const open=new Set([...data.querySelectorAll('details[open]')].map(x=>x.dataset.name));const nodes=[];for(const [name,f]of Object.entries(v.files)){const section=document.createElement('section'),d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');d.dataset.name=name;d.open=open.has(name);s.textContent=name+(f.truncated?' · earlier bytes omitted':'');p.textContent=f.text??JSON.stringify(f,null,2);d.append(s,p);section.append(d);nodes.push(section);}data.replaceChildren(...nodes);}catch(e){if(key===active)status.textContent='Connection unavailable: '+e.message+' · Last view retained';}finally{busy=false;}}setInterval(refresh,3000);
</script>
