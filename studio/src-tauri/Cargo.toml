[package]
name = "anicanto-studio"
version = "0.25.19"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = ["protocol-asset"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rfd = "=0.15.4"
libc = "=0.2.186"
fs2 = "=0.4.3"
anicanto-core = { path = "../../core" }

[profile.release]
opt-level = "s"
lto = true
strip = true

