[package]
name = "anicanto-windows-launcher"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
anicanto-core = { path = "../../core" }
serde_json = "=1.0.150"

[[bin]]
name = "AniCanto-Windows"
path = "src/main.rs"

[[bin]]
name = "AniCanto-helper"
path = "src/helper.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
