[package]
name = "anicanto-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

